name: Build Android APK

'on':
 workflow_dispatch: {}
  push:
branches:
- main

jobs:
build:
runs-on: ubuntu-22.04

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'

  - name: Install system dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y git zip unzip autoconf automake autopoint libtool pkg-config cmake libffi-dev libssl-dev zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 build-essential

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Accept SDK licenses and install build tools
    run: |
      yes | sdkmanager --licenses
      sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

  - name: Install Buildozer
    run: |
      python -m pip install --upgrade pip
      python -m pip install "setuptools<81" wheel
      python -m pip install "Cython==0.29.33"
      python -m pip install buildozer

  - name: Clean old build
    run: |
      rm -rf .buildozer bin

  - name: Build APK
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
    run: |
      buildozer -v android debug

  - name: Upload APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: MyApp-APK
      path: bin/*.apk
      if-no-files-found: error
